# nginx.https.conf — reverse proxy с HTTPS (после получения сертификата Let's Encrypt).
# Скопируйте в рабочий конфиг: cp nginx.https.conf nginx.conf
# Замените odintsovclinic.ru на ваш домен в server_name и в путях ssl_certificate / ssl_certificate_key.

# Gzip: уменьшает объём ответа (Lighthouse — «без сжатия»)
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

server {
    listen 80;
    server_name odintsovclinic.ru www.odintsovclinic.ru;

    # ACME-challenge для обновления сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name odintsovclinic.ru www.odintsovclinic.ru;

    ssl_certificate     /etc/letsencrypt/live/odintsovclinic.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odintsovclinic.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Увеличенный лимит для загрузки изображений через админку
    client_max_body_size 20M;

    location = /api/appointments/book {
        proxy_pass         http://app:4321;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 75s;
    }

    location ~ ^/api/integrations/mango/events/(call|summary)$ {
        allow 81.88.80.132;
        allow 81.88.80.133;
        allow 81.88.82.36;
        allow 81.88.82.44;
        allow 81.88.82.45;
        deny all;

        client_max_body_size 64k;
        proxy_pass              http://app:4321;
        proxy_http_version      1.1;
        proxy_pass_request_body on;
        proxy_request_buffering on;
        proxy_set_header        Content-Type $http_content_type;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Port $server_port;
        proxy_connect_timeout   3s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;
    }

    location / {
        proxy_pass         http://app:4321;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }
}

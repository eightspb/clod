name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    env:
      ADMIN_PASSWORD: ci-placeholder
      TOKEN_SECRET: ci-secret-for-build-test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Check for known vulnerabilities
        run: sh scripts/audit-dependencies.sh

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test]
    env:
      ADMIN_PASSWORD: ci-placeholder
      TOKEN_SECRET: ci-secret-for-build-test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test, build, security]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: clod:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify search index and environment gate inside the image
        run: |
          docker run --rm --entrypoint sh clod:ci -c 'test -f /app/dist/client/pagefind/pagefind-entry.json && test -f /app/dist/client/pagefind/pagefind.js'
          if docker run --rm --entrypoint node clod:ci /app/scripts/check-required-env.mjs; then echo 'env gate must fail without secrets' >&2; exit 1; fi
      - name: Verify no secret-bearing layers
        run: |
          if docker history --no-trunc clod:ci | grep -Eiq 'ADMIN_PASSWORD|TOKEN_SECRET|ASTRO_DB_APP_TOKEN|ENCRYPTION_KEY|MEDFLEX_CLINIC_TOKEN'; then echo 'image history leaks a secret name' >&2; exit 1; fi
          if docker run --rm --entrypoint sh clod:ci -c 'test -e /app/.env'; then echo '.env must not be baked into the image' >&2; exit 1; fi
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: env.PUBLISH == 'true'
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          docker tag clod:ci "$IMAGE:sha-$short_sha"
          docker tag clod:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$short_sha"
          docker push "$IMAGE:latest"

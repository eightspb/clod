services:
  app:
    image: ${CLOD_IMAGE:-ghcr.io/eightspb/clod}:${CLOD_IMAGE_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 95s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 700m
    pids_limit: 256
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - db-data:/data
      - uploads:/app/dist/client/uploads
    expose:
      - "4321"
    depends_on: []

  nginx:
    image: nginx:1.29.5-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  db-data:
  uploads:
  certbot-certs:
  certbot-www:

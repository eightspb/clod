<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#68D8B8"/>
      <stop offset="100%" stop-color="#44C4A0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#2BA888" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Clay circle background -->
  <rect width="32" height="32" rx="10" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Medical cross / pulse icon -->
  <path d="M10 16h4l2-5 4 10 2-5h4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

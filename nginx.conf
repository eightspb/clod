# nginx.conf — по умолчанию: только HTTP, без SSL (доступ по IP или до настройки домена).
# Раньше в репозитории здесь был HTTPS с путями к Let's Encrypt — без сертификатов nginx не стартовал.
# Для HTTPS после Certbot используйте nginx.https.conf (см. DEPLOY-BEGET.md, часть 4).

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://app:4321;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

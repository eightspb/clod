# nginx.https.conf — production-шаблон reverse proxy с HTTPS.
# Рабочий nginx.conf НЕ хранится в git: его генерирует scripts/render-nginx.sh,
# подставляя __SITE_DOMAIN__ и __NOINDEX_HEADER__ из .env (SITE_DOMAIN, NOINDEX).

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

# Edge-лимит на подбор пароля админки: 6 запросов в минуту с одного адреса.
limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;

# Запросы с чужим или пустым Host не доходят до приложения:
# Host-заголовок скармливается адаптеру Astro (GHSA-2pvr-wf23-7pc7).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name __SITE_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__SITE_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __SITE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__SITE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SITE_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers для prerendered-статики (middleware Astro её не видит).
    # Значения совпадают с src/middleware.js; SSR-дубликаты скрываются proxy_hide_header.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Robots-Tag;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://yandex.ru; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    __NOINDEX_HEADER__

    # Общие proxy-заголовки; location наследует их, если не задаёт свои.
    # Host фиксирован, X-Forwarded-Host пуст, X-Forwarded-For содержит только адрес клиента.
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $server_name;
    proxy_set_header   X-Forwarded-Host "";
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;

    # Лимит по умолчанию для загрузок через админку
    client_max_body_size 20M;

    location = /api/auth/login {
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://app:4321;
    }

    location ^~ /api/analytics/ {
        client_max_body_size 32k;
        proxy_pass http://app:4321;
    }

    location = /api/second-opinion {
        client_max_body_size 26M;
        proxy_pass http://app:4321;
    }

    location = /api/appointments/book {
        proxy_pass         http://app:4321;
        proxy_read_timeout 75s;
    }

    # Health-check интеграции для оператора без allowlist; точное совпадение
    # нужно, иначе nginx отвечает 301 на префикс без слэша.
    location = /api/integrations/mango {
        proxy_pass http://app:4321;
    }

    # Callback MANGO OFFICE: только адреса API Realtime, любой путь под префиксом.
    location ^~ /api/integrations/mango/ {
        allow 81.88.80.132;
        allow 81.88.80.133;
        allow 81.88.82.36;
        allow 81.88.82.44;
        allow 81.88.82.45;
        deny all;

        client_max_body_size 64k;
        proxy_pass              http://app:4321;
        proxy_http_version      1.1;
        proxy_pass_request_body on;
        proxy_request_buffering on;
        proxy_set_header        Content-Type $http_content_type;
        proxy_set_header        Host $server_name;
        proxy_set_header        X-Forwarded-Host "";
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Port $server_port;
        proxy_connect_timeout   3s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;
    }

    location / {
        proxy_pass http://app:4321;
    }
}

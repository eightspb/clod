# nginx.bootstrap.conf — этап 1 (только HTTP + ACME, для первичного выпуска Let's Encrypt)
#
# Использование:
#   1. cp nginx.bootstrap.conf nginx.conf
#   2. docker compose up -d nginx
#   3. docker compose run --rm certbot certonly \
#        --webroot -w /var/www/certbot \
#        -d odintsovclinic.ru -d www.odintsovclinic.ru \
#        --email admin@odintsovclinic.ru --agree-tos --no-eff-email
#   4. cp nginx.https.conf nginx.conf && nano nginx.conf   # домен и пути к сертификатам
#   5. docker compose up -d --build

server {
    listen 80;
    server_name odintsovclinic.ru www.odintsovclinic.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# nginx.http.conf — шаблон только HTTP, без SSL (доступ по IP или до настройки домена).
# Рабочий nginx.conf генерирует scripts/render-nginx.sh http; для HTTPS см. nginx.https.conf.

# Отдельная строка для callback MANGO: `docker compose logs nginx | grep '\[mango\]'` показывает,
# какие адреса были отклонены allowlist'ом ещё до приложения.
log_format clod_mango '[mango] $remote_addr $status "$request" $body_bytes_sent';

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
gzip_comp_level 6;

# Долгий кэш статики. Ответ Node-адаптера всегда «max-age=0», поэтому срок задаёт nginx:
# хэшированные бандлы и шрифты — год, картинки без хэша в имени — 30 дней, остальное без изменений.
map $uri $clod_static_expires {
    default    off;
    ~^/_astro/ 1y;
    ~^/fonts/  1y;
    ~^/images/ 30d;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;

server {
    listen 80 default_server;
    server_name _;

    # Docker DNS: адрес контейнера app переразрешается на каждом запросе, а не один раз при старте,
    # поэтому пересоздание app при деплое не оставляет nginx со старым IP и окном 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:4321;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Robots-Tag;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://yandex.ru; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    expires $clod_static_expires;
    __NOINDEX_HEADER__

    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $server_name;
    proxy_set_header   X-Forwarded-Host "";
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/auth/login {
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://$app_upstream$request_uri;
    }

    location ^~ /api/analytics/ {
        client_max_body_size 32k;
        proxy_pass http://$app_upstream$request_uri;
    }

    location = /api/second-opinion {
        client_max_body_size 26M;
        proxy_pass http://$app_upstream$request_uri;
    }

    location = /api/appointments/book {
        proxy_pass         http://$app_upstream$request_uri;
        proxy_read_timeout 75s;
    }

    location = /api/integrations/mango {
        proxy_pass http://$app_upstream$request_uri;
    }

    location ^~ /api/integrations/mango/ {
        access_log /dev/stdout clod_mango;
        allow 81.88.80.132;
        allow 81.88.80.133;
        allow 81.88.82.36;
        allow 81.88.82.44;
        allow 81.88.82.45;
        deny all;

        client_max_body_size 64k;
        proxy_pass              http://$app_upstream$request_uri;
        proxy_http_version      1.1;
        proxy_pass_request_body on;
        proxy_request_buffering on;
        proxy_set_header        Content-Type $http_content_type;
        proxy_set_header        Host $server_name;
        proxy_set_header        X-Forwarded-Host "";
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Port $server_port;
        proxy_connect_timeout   3s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;
    }

    location / {
        proxy_pass http://$app_upstream$request_uri;
    }
}

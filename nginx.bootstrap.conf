# nginx.bootstrap.conf — этап 1 (только HTTP + ACME, для первичного выпуска Let's Encrypt)
#
# Использование (домен берётся из SITE_DOMAIN в .env):
#   1. sh scripts/render-nginx.sh bootstrap
#   2. docker compose up -d nginx
#   3. docker compose run --rm certbot certonly \
#        --webroot -w /var/www/certbot \
#        -d "$SITE_DOMAIN" \
#        --email admin@odintsovclinic.ru --agree-tos --no-eff-email
#   4. sh scripts/render-nginx.sh https
#   5. docker compose up -d --build

server {
    listen 80;
    server_name __SITE_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__SITE_DOMAIN__$request_uri;
    }
}
